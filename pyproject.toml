[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certwatch"
version = "1.0.0"
description = "Real-time Certificate Transparency monitor that detects phishing and brand-impersonation domains"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amirhossein" }]
keywords = ["certificate-transparency", "phishing", "typosquatting", "blue-team", "soc", "brand-protection", "threat-detection", "certstream", "splunk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "websocket-client>=1.6",
    "requests>=2.31",
    "rich>=13.0",
    "tldextract>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
certwatch = "certwatch.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_GITHUB_USERNAME/certwatch"
Issues = "https://github.com/YOUR_GITHUB_USERNAME/certwatch/issues"

[tool.setuptools.packages.find]
include = ["certwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
